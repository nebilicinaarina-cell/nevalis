.rift-edge{z-index:1}
.final-open #double{visibility:visible;animation:climb-out 1.5s ease-out both}
.final-open #rift-left{animation:edge-left 1.5s ease-out both}
.final-open #rift-right{animation:edge-right 1.5s ease-out both}
@keyframes climb-out{
 0%{transform:translateY(-23px) scale(.63);opacity:0;filter:brightness(.47)}
 24%{opacity:1;transform:translateY(-17px) scale(.83);filter:brightness(.75)}
 60%{transform:translateY(-3px) scale(.97);filter:brightness(.95)}
 100%{transform:none;opacity:1;filter:none}
}
@keyframes edge-left{0%,20%{transform:none} 65%{transform:translate(-11px,1px)} 82%{transform:translate(-9px,0)} 100%{transform:translate(-11px,1px)}}
@keyframes edge-right{0%,20%{transform:none} 65%{transform:translate(12px,2px)} 82%{transform:translate(10px,1px)} 100%{transform:translate(12px,2px)}}
@media(prefers-reduced-motion:reduce){
 .final-open #double,.final-open #rift-left,.final-open #rift-right{animation:none}
}

 {id:'kwak', x:1765, title:'Мадам Квак', credit:"Аким Небылицын (Nevalis) · 2026 · Линеры",text:"Графический скетч лягушкоподобного существа с огромными глазами.",note:"История Мадам Квак в разработке. На вопросы она пока отвечает только взглядом.",art:'./assets/f552c3233e6f394f995e92e7.png',record:{"label": "КПП · запись ночной смены", "body": "В 03:12 в нижней части окна появилась Мадам Квак. Стажёр помахал ей. Наутро на стекле с внутренней стороны нашли отпечаток его ладони."}},
 {id:'bull', x:2261, title:'Бык', credit:"Аким Небылицын (Nevalis) · 2026",text:"Графический скетч фантастической головы с вытянутой мордой и длинным рогом.",note:"История аномалии в разработке. Издалека все называют его быком. Вблизи уточнять никто не берётся.",record:{"label": "Заводская улица · протокол у ворот", "body": "Бык бросается на всё, что движется. Вчера он трижды протаранил ворота, перепутав своё отражение с соперником. В четвёртый раз ворота уже были открыты, но он всё равно разогнался и ударил в косяк. В отчёте записали: «Агрессивен. Учится медленно»."}},
 {id:'abstract', x:2391, title:'Скетч без названия', credit:"Аким Небылицын (Nevalis) · 2026",text:"Абстрактный скетч с цветными пятнами и графическими деталями.",note:"История аномалии в разработке. Экран показывает что-то, но инструкцию к нему пока ищут.",record:{"label": "Заводская улица · записка у экрана", "body": "Говорят, через этот экран когда-то можно было связаться с другим миром, где аномалий нет. Последний дежурный записал, что в ответ на проверку связи кто-то пожаловался на обычный дождь. Экран давно не работает, и на такой разговор теперь готовы потратить всю смену."}},

 {id:'toothy', x:4189, title:'Зубастик', art:'./assets/5bb6e81777eb9d2ede18838f.png', credit:"Аким Небылицын (Nevalis) · 2026 · Цифровая графика (iPad и стилус)",text:"Персонаж из серии фантастических существ, выполненных в образе сшитых из мешковины и других тканей созданий. Изначально образ был создан самостоятельно, без опоры на предварительные наброски. Позже работа была дополнена визуальными эффектами, которые придали персонажу более агрессивный и жуткий вид.",record:{"label": "Разрушенный цех · журнал у окна", "body": "При свете фонаря различимы швы на мешковине. Нитка, оставленная на подоконнике, к утру исчезла. На следующей фотографии у существа появился ещё один шов, точно под левым глазом."}},
 {id:'head-panel', x:4458, title:'Скетч без названия', credit:"Аким Небылицын (Nevalis) · 2026",text:"Скетч биомеханической головы с вытянутым силуэтом и органическими деталями.",note:"История аномалии в разработке. Назначение деталей выясняется, трогать их пока не советуют.",record:{"label": "Разрушенный цех · заметка на обороте схемы", "body": "На обороте рисунка стоит дата: 2026 год. Подписи нет, только исправления поверх ранних контуров. Возможно, это одна из первых разработок Создателя аномальной зоны, когда о нём ещё никто не знал."}},
 {id:'elongated', x:4798, title:'Скетч без названия', art:'./assets/aa8a3686d2be1c6943493bf2.png', credit:"Аким Небылицын (Nevalis) · 2026",text:"Скетч существа с вытянутой головой, прорисованной в профиль.",note:"История аномалии в разработке. Фас найти не удалось: оно всё время отворачивается.",record:{"label": "Разрушенный цех · наблюдение у пролома", "body": "Когда прожектор направили на стену, существо повернуло голову в тень. Повторили опыт с двух сторон: голову удалось увидеть целиком, но на обоих снимках она снята в профиль."}},
 {id:'plant',x:5089,title:'Скетч без названия',art:'./assets/1e168e458ccdf48f67870912.png',credit:"Аким Небылицын (Nevalis) · 2026",text:"Скетч оранжевого растительного существа с глазами и длинными зелёными отростками.",note:"История аномалии в разработке. В журнале пока записано: «Не поливать».",record:{"label": "Заросшие руины · журнал оранжевого образца", "body": "Поставили горшок на метку у плиты. Через час горшок стоял там же, а метка оказалась на три сантиметра правее. Проверили линейку. Линейка тоже пустила корни."}},

 {id:'nosach',x:6256,title:'Носач',art:'./assets/88f281563698fdf4a5bb487d.png',credit:"Аким Небылицын (Nevalis) · 2026 · Карандашный рисунок с последующей цифровой обработкой",text:"Оригинальный персонаж, разработанный специально для создания мягкой игрушки на заказ. Идея появилась при выборе подарка на Новый год. Образ был придуман с нуля, а позднее по нему изготовили игрушку. Название совпадает с названием носача — вида обезьян, однако внешне персонаж отличается от него: у него округлая, напоминающая картофелину форма тела, розовая окраска и черты лица, скорее напоминающие человеческие.",record:{"label": "Заросшие руины · свидетельство дежурного", "body": "Дежурный потерял варежку. Носач принюхался и через час притащил целых семь: соседскую, детскую и одну, связанную на большой палец Носача. Свою дежурный так и не нашёл, зато вечером вернулся с двумя горячими пирожками. С тех пор они завтракают вместе."}},

 art.hidden=Boolean(card.final);

  art.src=card.art??card.button.querySelector('img').src;
  art.alt=card.title;
 }
 dialog.classList.toggle('final-card',Boolean(card.final));
 const credit = document.querySelector('#cardCredit');
 credit.textContent=card.credit??'';
 credit.hidden=!card.credit;
 const note = document.querySelector('#cardNote');
 note.textContent=card.note??'';
 note.hidden=!card.note;
 fieldLog.open=false;
 fieldLog.hidden=!card.record;
 fieldLabel.textContent=card.record?.label??'';
 fieldBody.textContent=card.record?.body??'';

 dialog.showModal();
}

function populateExhibition(){
 const grid=document.querySelector('#workGrid');
 if(grid.childElementCount)return;
 const entries=new Map(cards.map(card=>[card.id,card]));
 for(const id of catalogueOrder){
  const card=entries.get(id)??catalogueOnly[id];
  const title=exhibitionLabels[id]??card.title;
  const tile=document.createElement('button');
  tile.type='button';
  tile.className='work-tile';
  const thumbnail=document.createElement('img');
  thumbnail.src=card.art??card.button.querySelector('img').src;
  thumbnail.alt='';
  thumbnail.loading='lazy';
  thumbnail.decoding='async';
  const caption=document.createElement('span');
  caption.textContent=title;
  tile.append(thumbnail,caption);
  tile.onclick=()=>openCard({...card,title},true);
  grid.append(tile);
 }
}

  if(id==='exhibition')populateExhibition();
  sectionDialog.classList.toggle('shop-open',id==='shop');
  if(id==='shop'&&!shopFrame.hasAttribute('src'))shopFrame.src=shopFrame.dataset.src;
  menuDialog.close();
  sectionDialog.showModal();
  sectionDialog.scrollTop=0;
  sectionTitle.focus({preventScroll:true});
 };
}
const shopFrame=document.querySelector('#shopFrame');
addEventListener('message',event=>{
 if(event.source!==shopFrame.contentWindow||event.origin!==location.origin)return;
 if(event.data==='nevalis-close-shop'&&sectionDialog.open&&!document.querySelector('#shop').hidden)sectionDialog.close();
});
sectionDialog.addEventListener('close',()=>view.focus({preventScroll:true}));
inspect.onclick=()=>{if(nearest)openCard(nearest)};
const doubleButton = document.querySelector('#double');
const moves = {ArrowLeft:-1,ArrowRight:1,KeyA:-1,KeyD:1};
addEventListener('keydown',event=>{
 if(dialog.open||menuDialog.open||sectionDialog.open)return;
 if(event.code in moves){event.preventDefault();keys.add(event.code);}
 if(event.code==='KeyE' && !event.repeat && nearest)openCard(nearest);
});
addEventListener('keyup',event=>keys.delete(event.code));
addEventListener('blur',clearInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});
for(const button of document.querySelectorAll('[data-dir]')){
 button.addEventListener('pointerdown',event=>{
  button.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId,Number(button.dataset.dir));
 });
 for(const name of ['pointerup','pointercancel','lostpointercapture']){
  button.addEventListener(name,event=>pointers.delete(event.pointerId));
 }
}
function distanceToCard(card){
 const outside=card.outsideX??card.x;
 return Math.max(0,Math.min(card.x,outside)-x,x-Math.max(card.x,outside));
}
function sprite(moving){
 const frame=moving?1+Math.floor(gait)%4:0;
 actor.style.backgroundPositionX=(-76*frame)+'px';
 actor.style.transform='scaleX('+facing+')';
}
function tick(now){
 const dt=Math.min((now-(previous||now))/1000,.05);
 previous=now;
 const dir=Math.sign([...keys].reduce((sum,key)=>sum+moves[key],0)+[...pointers.values()].reduce((sum,value)=>sum+value,0));
 const old=x;
 x=Math.max(32,Math.min(worldWidth-32,x+205*dir*dt));
 if(dir)facing=dir;
 if(!introHint.hidden&&Math.abs(x-146)>220)dismissIntro();
 gait=old!==x?gait+dt*11:0;
 sprite(old!==x);
 actor.style.left=(Math.round(x)-38)+'px';
 const camera=Math.max(0,Math.min(worldWidth-visibleWidth,x-visibleWidth*.37));
 world.style.transform='translateX('+(-Math.round(camera*scale))+'px) scale('+scale+')';
 if(doubleButton.disabled&&x>=doubleTrigger){
  world.classList.add('final-open');
  doubleButton.disabled=false;
 }
 const previousCard=nearest;
 nearest=cards.reduce((best,card)=>{
  if(card.button.disabled)return best;
  const distance=distanceToCard(card);
  const reach=card.outsideX?90:110;
  return distance<reach&&(!best||distance<distanceToCard(best))?card:best;
 },null);
 if(previousCard!==nearest){
  previousCard?.button.classList.remove('near');
  nearest?.button.classList.add('near');
 }
 inspect.disabled=!nearest||dialog.open;
 const nextZone=x<streetStart?'ул. Заброшенный пост'
  :x<anomalyStart?'ул. Первой аномалии'
  :x<ruinsStart?'ул. Сущностей'
  :x<finalStart?'ул. Надежды'
  :'ул. Смирения';
 if(zoneTitle.textContent!==nextZone)zoneTitle.textContent=nextZone;
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
<script src="./nevalis-audio.js" defer></script>
